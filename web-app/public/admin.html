<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MandalaPulse Admin — Create Test User</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; max-width: 720px; }
    label { display:block; margin:12px 0 4px; font-weight:600; }
    input { width:100%; padding:8px; box-sizing:border-box; }
    button { margin-top:12px; padding:10px 16px; }
    pre { background:#f6f8fa; padding:12px; margin-top:12px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h2>Create Test User</h2>

  <form id="registerForm">
    <label for="newUser">Username</label>
    <input id="newUser" name="username" required autocomplete="username" />

    <label for="newPass">Password</label>
    <input id="newPass" name="password" type="password" required autocomplete="new-password" />

    <button type="submit">Create user</button>
  </form>

  <h3>Result</h3>
  <pre id="result">No request yet</pre>

  <script>
    // REPLACE this with your deployed registerUser function URL
    const FUNCTION_URL = "https://us-central1-mandalapulse108.cloudfunctions.net/registerUser";

    const form = document.getElementById('registerForm');
    const out = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('newUser').value.trim();
      const password = document.getElementById('newPass').value.trim();

      if (!username || !password) {
        out.textContent = 'Username and password are required';
        return;
      }
      out.textContent = 'Sending request...';

      try {
        const r = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const j = await r.json();
        out.textContent = JSON.stringify(j, null, 2);
      } catch (err) {
        out.textContent = 'Network/error: ' + err.message;
      }
    });
  </script>
</body>
</html>

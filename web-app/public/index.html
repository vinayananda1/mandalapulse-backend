<!-- 🪷 MandalaPulse Login Invocation Scroll — Firebase Unified -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MandalaPulse Login</title>
  <script type="module">
    // 🔗 Firebase SDK Invocation
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_ZgFPk96jknJHGM23QNbC14utVbpBZzM",
      authDomain: "mandalapulse108.firebaseapp.com",
      projectId: "mandalapulse108",
      storageBucket: "mandalapulse108.appspot.com",
      messagingSenderId: "646421365207",
      appId: "1:646421365207:web:d0efbb1484362bbcae8b92"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 🧘🏽‍♂️ Login Invocation
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("loginForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!username || !password) {
          alert("⚠️ Please enter both username and password.");
          return;
        }

        const dbRef = ref(db);
        try {
          const snapshot = await get(child(dbRef, `users/${username}`));
          if (snapshot.exists()) {
            const user = snapshot.val();
            if (user.password === password) {
              alert("✅ Login successful: Welcome " + username);
              window.location.href = `/verify.html?username=${encodeURIComponent(username)}`;
            } else {
              alert("❌ Incorrect password.");
            }
          } else {
            alert("❌ User not found.");
          }
        } catch (error) {
          alert("⚠️ Firebase invocation error: " + error.message);
        }
      });
    });
  </script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      padding: 2rem;
      text-align: center;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🪷 Login to MandalaPulse</h2>
    <form id="loginForm">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required /><br /><br />

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required /><br /><br />

      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
